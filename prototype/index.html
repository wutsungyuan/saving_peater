<title>英文句型解剖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* 版面：三欄。左側欄=句子成分圖例、中欄=輸入與句子卡片、右側欄=詞性圖例；兩側欄 sticky 常駐。
   本頁刻意只做淺色主題 — 不隨系統深色模式變換。 */
:root{
  color-scheme:light;
  --bg:#eceff1; --surface:#ffffff; --surface-2:#f2f6f8;
  --fg:#0f171c; --muted:#3b4951; --faint:#67767f; --rule:#c7d2d9;
  --accent:#0a615e; --on-accent:#ffffff;
  --c-s:#11529f; --c-v:#a82a1e; --c-o:#0f6637; --c-c:#642b97;
  --c-io:#046177; --c-do:#0f6637; --c-mod:#55646e;
  --err:#a82a1e; --err-bg:#fcebe8; --tip-bg:#e2f0ef;
  --pos-adj:#8a5300; --pos-adv:#046177; --pos-dim:#39474f;
  /* 代名詞格位。經 validate_palette.js 驗證：色盲 ΔE 10.2、文字對比 6.03:1 */
  --pos-pron:#8a3fb8;
  /* 圖表的狀態色：紅／琥珀／綠。經 validate_palette.js 驗證，
     色盲下相鄰 ΔE 15.1、正常視覺 20.1、對比皆 ≥3:1 */
  --st-bad:#a82a1e; --st-mid:#b8821f; --st-good:#0f6637; --st-none:#9aa8b0;
  /* 游標提示＝便條紙。對比皆達 WCAG AA 正文標準（5.7:1 以上） */
  --note-bg:#fdf4c4; --note-fg:#2a2410; --note-mute:#6b5f2e;
  --note-dim:#4a4221; --note-rule:#d9c478;
  --font-en:'Literata',Georgia,'Times New Roman',serif;
  --font-ui:'Noto Sans TC',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);margin:0;
  padding-inline:16px;padding-block:26px 56px;-webkit-font-smoothing:antialiased}

/* 三欄骨架 */
.page{display:grid;gap:24px;justify-content:center;
  grid-template-columns:[l] 186px [c] minmax(0,900px) [r] 186px}
.center{grid-column:c;display:flex;flex-direction:column;gap:20px;min-width:0}
/* 三個分頁各自也要有縱向間距 —— 它們是 .center 的單一子元素，不會繼承 gap */
[id^="view-"]{display:flex;flex-direction:column;gap:20px;min-width:0}
.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 18px);
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px}
.rail-l{grid-column:l} .rail-r{grid-column:r}
.rail h3{margin:0 0 11px;font-size:.72rem;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);
  padding-bottom:9px;border-bottom:1px solid var(--rule)}
.rail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rail li{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.rail li i{width:17px;height:3.5px;border-radius:2px;flex-shrink:0}
.rail li em{font-family:var(--font-mono);font-style:normal;font-weight:700;font-size:.78rem;
  color:var(--k);min-width:2.6em;flex-shrink:0}
.rail li.sub{padding-left:25px;font-size:.8rem;color:var(--faint);gap:7px}
.rail li.sub em{font-weight:600;min-width:1.6em;font-family:var(--font-ui)}
.rail .div{height:1px;background:var(--rule);margin:4px 0}
.rail li.hot{color:var(--fg);font-weight:500}
.rail .foot{margin-top:11px;padding-top:9px;border-top:1px solid var(--rule);
  font-size:.74rem;color:var(--faint);line-height:1.6}
/* 窄螢幕：側欄收起，改用中欄內的橫向圖例 */
.legend-inline{display:none}
@media (max-width:1180px){
  .page{grid-template-columns:minmax(0,900px)}
  .center{grid-column:1}
  .rail{display:none}
  .legend-inline{display:flex;flex-direction:column;gap:7px;
    padding:11px 13px;background:var(--surface);border:1px solid var(--rule);border-radius:4px}
  .legend-inline .lrow{display:flex;gap:5px 13px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
  .legend-inline .lrow>b{font-family:var(--font-mono);font-size:.68rem;font-weight:700;
    letter-spacing:.08em;color:var(--faint);text-transform:uppercase;flex-shrink:0}
  .legend-inline .lrow span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .legend-inline .lrow i{width:16px;height:3.5px;border-radius:2px;flex-shrink:0}
  .legend-inline .lrow em{font-family:var(--font-mono);font-style:normal;font-weight:700;font-size:.76rem}
}

header h1{font-weight:700;font-size:1.6rem;letter-spacing:-.01em;margin:0 0 7px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.72;max-width:60ch}
header .rule{height:3px;background:var(--accent);width:46px;margin-bottom:14px;border-radius:2px}

.box{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:15px}
.box label{display:block;margin:0;font-size:.72rem;font-weight:700;letter-spacing:.09em;
  color:var(--muted);text-transform:uppercase;font-family:var(--font-mono)}
.lblrow{margin-bottom:8px}
      .lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count{font-family:var(--font-mono);font-size:.74rem;color:var(--faint);white-space:nowrap}
.count.near{color:var(--pos-adj)} .count.over{color:var(--err);font-weight:700}
textarea{width:100%;min-height:74px;max-height:56vh;resize:vertical;overflow-y:hidden;background:var(--surface-2);color:var(--fg);
  border:1px solid var(--rule);border-radius:3px;padding:11px 12px;font-family:var(--font-en);
  font-size:1.05rem;line-height:1.6}
textarea:focus-visible,button:focus-visible,.w:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:11px}
button{font-family:var(--font-ui);font-size:.85rem;cursor:pointer;border-radius:3px;
  border:1px solid var(--rule);background:var(--surface-2);color:var(--fg);padding:7px 13px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.hint{font-size:.82rem;color:var(--muted);line-height:1.6}

#usageBar{display:flex;gap:7px 18px;flex-wrap:wrap;align-items:baseline;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:11px 15px;
  font-size:.84rem;color:var(--muted)}
#usageBar .u{display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
#usageBar .u b{font-family:var(--font-mono);font-weight:700;color:var(--fg);font-size:.92rem}
#usageBar .u.cost b{color:var(--accent)}
#usageBar .u.saved b{color:var(--c-o)}
#usageBar .u.halt{color:var(--err);font-weight:600;width:100%}
#usageBar .u.halt b{color:var(--err);font-size:1.05rem}
#usageBar .retry{font-size:.82rem;padding:6px 14px;background:var(--accent);
  border-color:var(--accent);color:var(--on-accent);font-weight:600;margin-top:4px}
#usageBar .note{font-size:.76rem;color:var(--faint);width:100%;line-height:1.6}

.usage-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.ucard{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.ucard h4{margin:0 0 9px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-family:var(--font-mono)}
.ucard .big{font-family:var(--font-mono);font-size:1.5rem;font-weight:700;color:var(--accent);line-height:1.2}
/* 弱點圖表：橫向長條、依正確率排序、數字直接標在旁邊（不靠顏色辨識） */
.wk-hero{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:18px 20px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.wk-hero .n{font-family:var(--font-mono);font-size:2.6rem;font-weight:700;line-height:1;color:var(--accent)}
.wk-hero .lbl{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.6}
.wk-hero .sep{width:1px;align-self:stretch;background:var(--rule)}
.wk-hero .cta{margin-left:auto}
.wk-empty{background:var(--surface);border:1px dashed var(--rule);border-radius:4px;
  padding:20px;font-size:.9rem;color:var(--muted);line-height:1.8}

.wk-sec{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px 18px}
.wk-sec+.wk-sec{margin-top:14px}
.wk-sec h4{margin:0 0 4px;font-size:.74rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-family:var(--font-mono)}
.wk-sec .cap{font-size:.78rem;color:var(--faint);margin:0 0 13px;line-height:1.6}
.wk-rows{display:flex;flex-direction:column;gap:9px}
.wk-row{display:grid;grid-template-columns:11em minmax(0,1fr) auto;gap:12px;align-items:center}
.wk-row .name{font-size:.86rem;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-row .name small{color:var(--faint);font-family:var(--font-mono);font-size:.72rem;margin-left:5px}
.wk-track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--rule)}
.wk-fill{height:100%;border-radius:6px;min-width:3px}
.wk-val{font-family:var(--font-mono);font-size:.82rem;white-space:nowrap;color:var(--fg);
  display:flex;gap:8px;align-items:baseline}
.wk-val b{font-weight:700;min-width:3.4em;text-align:right}
.wk-val .frac{color:var(--faint);font-size:.76rem;min-width:3.6em}
.wk-val .tag{font-size:.7rem;font-family:var(--font-ui);padding:1px 7px;border-radius:999px;
  border:1px solid currentColor;min-width:3.4em;text-align:center}
.wk-row.bad .wk-fill{background:var(--st-bad)} .wk-row.bad .wk-val .tag{color:var(--st-bad)}
.wk-row.mid .wk-fill{background:var(--st-mid)} .wk-row.mid .wk-val .tag{color:var(--st-mid)}
.wk-row.good .wk-fill{background:var(--st-good)} .wk-row.good .wk-val .tag{color:var(--st-good)}
.wk-row.none .wk-fill{background:var(--st-none);opacity:.6}
.wk-row.none .wk-val{color:var(--faint)} .wk-row.none .wk-val .tag{color:var(--st-none)}
@media (max-width:560px){ .wk-row{grid-template-columns:8em minmax(0,1fr)}
  .wk-val{grid-column:1/-1;justify-content:flex-end} }

.quota-note{margin:0;font-size:.84rem;line-height:1.75;color:var(--muted);
  background:var(--surface);border:1px dashed var(--rule);border-radius:4px;padding:12px 16px}
.quota-note b{color:var(--fg)}
.ucard .sub{font-size:.8rem;color:var(--muted);margin-top:7px;line-height:1.7}
h3.sec{margin:4px 0 0;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-family:var(--font-mono)}

.hitem{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:13px 16px;
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%;
  font-family:inherit;color:inherit}
.hitem+.hitem{margin-top:9px}
.hitem:hover{border-color:var(--accent)}
.hitem .htext{flex:1;min-width:0;font-family:var(--font-en);font-size:1rem;line-height:1.6;color:var(--fg)}
.hkind{display:inline-block;font-size:.68rem;font-family:var(--font-mono);letter-spacing:.06em;
  padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--faint);
  margin-right:8px;vertical-align:2px}
.hkind.word{border-color:var(--pos-pron);color:var(--pos-pron)}
.hkind.gone{border-color:var(--err);color:var(--err)}
.hitem.hdead .hname{text-decoration:line-through;text-decoration-thickness:1px}
.hname{display:block;font-family:var(--font-ui);font-weight:600;font-size:.95rem;
  color:var(--fg);margin-top:4px}
.hwords{display:block;font-family:var(--font-en);font-size:.86rem;color:var(--muted);
  line-height:1.65;margin-top:3px}
.hnote{font-size:.8rem;color:var(--err);background:var(--err-bg);border:1px solid var(--err);
  border-radius:3px;padding:6px 10px;margin-top:8px}
.hitem .hmeta{font-size:.76rem;color:var(--faint);margin-top:6px;font-family:var(--font-ui);
  display:flex;gap:10px;flex-wrap:wrap}
.hitem .hmeta b{font-family:var(--font-mono);color:var(--muted);font-weight:600}
.hgone{opacity:.55;cursor:default}
.hgone:hover{border-color:var(--rule)}
.note-retain{font-size:.78rem;color:var(--faint);margin:12px 0 0;line-height:1.6}

.tabs{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;align-self:flex-start}
.tabs button{border:0;border-radius:0;background:var(--surface);padding:9px 22px;font-size:.92rem;
  color:var(--muted);font-weight:500}
.tabs button+button{border-left:1px solid var(--rule)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.tabs button.needs-api{color:var(--faint)}
.tabs button.needs-api::after{content:'·';margin-left:5px;font-weight:700;color:var(--st-mid)}
.tabs button.needs-api[aria-pressed="true"]{color:var(--on-accent)}
.demo-note{margin:0;font-size:.82rem;color:var(--muted);line-height:1.7;
  background:#fdf4c4;border:1px solid #d9c478;border-radius:3px;padding:10px 13px}
select{font-family:var(--font-ui);font-size:.85rem;padding:6px 10px;border:1px solid var(--rule);
  border-radius:3px;background:var(--surface-2);color:var(--fg)}
.tchip{font-size:.8rem;padding:5px 12px;border:1px solid var(--rule);background:var(--surface-2);
  color:var(--muted);border-radius:999px;cursor:pointer}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600}
.wklink{font-size:.8rem;color:var(--accent);margin-left:auto;background:none;border:0;
  padding:4px 0;border-bottom:1.5px solid currentColor;border-radius:0;font-weight:600}

.linky{font-size:.8rem;color:var(--accent);background:none;border:0;padding:2px 0;
  border-bottom:1.5px solid currentColor;border-radius:0;font-weight:600}
input[type="text"]{font-family:var(--font-ui);font-size:.92rem;padding:8px 11px;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface-2);color:var(--fg)}
.wchip{font-size:.82rem;padding:6px 13px;border:1px solid var(--rule);background:var(--surface);
  color:var(--muted);border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:baseline}
.wchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface);font-weight:600}
.wchip small{font-family:var(--font-mono);font-size:.72rem;opacity:.75}
.wchip small.when{opacity:.5}
.linky.danger{color:var(--muted)}
.linky.danger:hover{color:var(--err)}
.linky.danger[data-armed="1"]{color:var(--err);font-weight:700}
.wlist{display:flex;flex-direction:column;gap:9px}
.wcard{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:13px 16px}
.wcard .top{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.wcard .term{font-family:var(--font-en);font-size:1.22rem;font-weight:600;color:var(--fg)}
.wcard .syl{font-family:var(--font-mono);font-size:.8rem;color:var(--pos-adv)}
.wcard .box-tag{font-size:.7rem;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);
  color:var(--faint);margin-left:auto}
.wcard .box-tag.hot{border-color:var(--st-bad);color:var(--st-bad)}
.wcard .box-tag.good{border-color:var(--st-good);color:var(--st-good)}
.wsense{margin-top:9px;padding-left:11px;border-left:2px solid var(--rule);font-size:.88rem;line-height:1.75}
.wsense b{font-family:var(--font-mono);font-size:.76rem;color:var(--pos-dim);margin-right:7px}
.wsense .ex{font-family:var(--font-en);color:var(--muted);display:block}
.wsense .exz{color:var(--faint);font-size:.84rem;display:block}
.wtip{margin-top:9px;font-size:.82rem;color:var(--st-mid);line-height:1.6}
.wextra{margin-top:7px;font-size:.8rem;color:var(--faint);line-height:1.7}
.sayx{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;padding:0;border-radius:50%;flex-shrink:0;
  background:var(--surface-2);border:1px solid var(--rule);color:var(--muted);
  vertical-align:middle;margin-left:7px;cursor:pointer}
.sayx:hover{border-color:var(--accent);color:var(--accent);background:var(--tip-bg)}
.sayx .ico{width:0;height:0;border-style:solid;border-width:4px 0 4px 6px;
  border-color:transparent transparent transparent currentColor;margin-left:1px}
.sayx.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sayx.on .ico{width:6px;height:6px;border:0;border-radius:1px;background:currentColor;margin:0}
.wcard .top .sayx{margin-left:4px}
.wsense .ex .sayx{margin-left:6px}
.q-speak.on .ico{width:9px;height:9px;border:0;border-radius:1px;background:currentColor}
.q-speak{display:inline-flex;align-items:center;gap:7px;font-size:.9rem;padding:9px 18px;
  border-radius:999px;background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.q-speak .ico{width:0;height:0;border-style:solid;border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent currentColor}
.q-zh{font-size:1.3rem;font-weight:600;color:var(--fg)}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px 18px;
  display:flex;flex-direction:column;gap:11px}
.q+.q{margin-top:13px}
.q-head{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.q-no{font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:.92rem}
.q-type{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--rule);border-radius:999px;padding:2px 9px}
.q-prompt{font-size:.95rem;color:var(--fg);font-weight:500}
.q-sent{font-family:var(--font-en);font-size:1.22rem;line-height:1.75;color:var(--fg)}
.q-sent mark{background:color-mix(in srgb,var(--accent) 20%,transparent);color:inherit;
  padding:1px 3px;border-radius:2px;font-weight:600}
.q-hint{font-family:var(--font-en);color:var(--accent);font-size:1rem}
.q-opts{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;gap:9px;align-items:center;font-size:.92rem;cursor:pointer;
  border:1px solid var(--rule);border-radius:3px;padding:8px 12px;background:var(--surface-2)}
.q-opt:hover{border-color:var(--accent)}
.q-opt input{accent-color:var(--accent);margin:0}
.q-blanks{display:flex;gap:9px;flex-wrap:wrap}
.ime-warn{font-size:.8rem;color:var(--err);background:var(--err-bg);border:1px solid var(--err);
  border-radius:3px;padding:6px 10px;margin-top:7px;line-height:1.6;width:100%;
  opacity:0;transform:translateY(-3px);transition:opacity .15s,transform .15s;pointer-events:none}
.ime-warn[data-show="1"]{opacity:1;transform:none}
.q-blanks input{font-family:var(--font-en);font-size:1rem;padding:8px 11px;border:1px solid var(--rule);
  border-radius:3px;background:var(--surface-2);color:var(--fg);min-width:140px}
.q.graded{border-width:2px}
.q.ok{border-color:var(--c-o)} .q.ng{border-color:var(--err)}
.q-result{font-size:.88rem;line-height:1.75;padding:11px 13px;border-radius:3px;white-space:pre-line}
.q.ok .q-result{background:#eaf6ee;border:1px solid var(--c-o);color:var(--muted)}
.q.ng .q-result{background:var(--err-bg);border:1px solid var(--err);color:var(--muted)}
.q-verdict{font-weight:700;display:block;margin-bottom:5px}
.q.ok .q-verdict{color:var(--c-o)} .q.ng .q-verdict{color:var(--err)}
.q-ans{font-family:var(--font-en);font-weight:700;color:var(--fg)}
#quizSummary{background:var(--surface);border:2px solid var(--accent);border-radius:4px;

<script>

const ROLE = {

const CASE = {
  subject:        { zh:'主格',       short:'主',   why:'當主詞，放在動詞前面' },
  object:         { zh:'受格',       short:'受',   why:'當動詞或介系詞的受詞' },
  possessive:     { zh:'所有格',     short:'所有', why:'後面一定接名詞，例如 my book' },
  'possessive-pron':{ zh:'所有格代名詞', short:'所代', why:'後面不接名詞，自己當名詞用' },
  reflexive:      { zh:'反身代名詞', short:'反身', why:'強調「自己」，例如 by himself' },

// 右側欄的速查表（完整七人稱表太寬，這裡只列最常考的幾個）
const CASE_TABLE = [
  ['主',   'I / he / she / they'],
  ['受',   'me / him / her / them'],
  ['所有', 'my / his / her / their'],
  ['所代', 'mine / his / hers / theirs'],
  ['反身', 'myself / himself / herself'],
];
const POS = {
  adj:{zh:'形容詞',why:'修飾名詞，或當補語說明主詞怎麼樣。連結動詞後面要接這個'},
  adv:{zh:'副詞',why:'修飾動詞、形容詞或另一個副詞。不能當連結動詞的補語'},
  n:{zh:'名詞',why:'人、事、物的名稱'},
  pron:{zh:'代名詞',why:'代替名詞，當受詞要用受格 me / him / them'},
  v:{zh:'動詞',why:'動作或狀態'},
  aux:{zh:'助動詞',why:'幫主要動詞表達時態、否定或疑問'},
  prep:{zh:'介系詞',why:'後面接名詞組成介系詞片語，整組當修飾語'},
  conj:{zh:'連接詞',why:'連接單字、片語或子句'},
  art:{zh:'冠詞',why:'a / an / the，放在名詞前面'},
  num:{zh:'數詞',why:'表示數量或順序'},
  to:{zh:'不定詞 to',why:'後面接原形動詞'},
  interj:{zh:'感嘆詞',why:'表達情緒或引起注意'},
};
const SAMPLES_A = [
  ['p1','句型一 S+V'],['p2','句型二 S+V+C'],['p3','句型三 S+V+O'],
  ['p4','句型四 S+V+IO+DO'],['p5','句型五 S+V+O+C'],
];
const SAMPLES_B = [
  ['standard','主動賓方地時'],['compare45','句型四／五對照'],['splitVerb','動詞分段'],
  ['errorCase','含文法錯誤'],['compound','對等連接詞'],['outOfScope','超出範圍'],
  ['paragraph','整段文章'],
];
const SAMPLES = [...SAMPLES_A, ...SAMPLES_B];
// 實詞：句子下方預設只標這些，虛詞改由游標提示與詳解呈現（短字如 a / I 的標籤會擠在一起）
const CONTENT_POS = new Set(['n','v','adj','adv','aux']);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 左側欄：句子成分 ----
const CORE = ['S','V','O','C','IO','DO'];
const MODS = ['M-manner','M-place','M-time','M-freq'];

  <li class="div"></li>
  <li><i style="background:repeating-linear-gradient(90deg,var(--c-mod) 0 3px,transparent 3px 6px)"></i><em style="--k:var(--c-mod)">修</em>修飾語</li>
  ${MODS.map(r => `<li class="sub"><em>${ROLE[r].code}</em>${ROLE[r].zh.replace('修飾語','')}</li>`).join('')}
</ul><div class="foot">判斷句型前先把修飾語劃掉，看動詞後面還剩什麼。</div>`;

// ---- 右側欄：詞性 ----
const POS_ORDER = ['adj','adv','n','pron','v','aux','prep','conj','art','num','to'];
document.getElementById('rail-p').innerHTML = `<h3>詞性</h3><ul>
  ${POS_ORDER.map(p => {
    const hot = p === 'adj' || p === 'adv';
    const k = hot ? `var(--pos-${p})` : 'var(--muted)';
    return `<li class="${hot ? 'hot' : ''}"><em style="--k:${k}">${p}</em>${POS[p].zh}</li>`;
  }).join('')}
</ul>
  <h3 style="margin-top:14px">代名詞格位</h3>
  <ul>${CASE_TABLE.map(([k, v]) =>
    `<li><em style="--k:var(--pos-pron);min-width:2.8em">${k}</em>
       <span style="font-family:var(--font-en);font-size:.78rem">${v}</span></li>`).join('')}</ul>
  <div class="foot">所有格後面一定接名詞（my <b>book</b>），所有格代名詞後面不接（This is <b>mine</b>）。
    <br>切到「代名詞」模式可以只看格位。</div>
  <div class="foot" style="border:0;padding-top:4px;margin-top:4px">形容詞與副詞用顏色標出 —— 連結動詞後面只能接形容詞。<br><br>動詞標成 <b style="color:var(--c-v);font-family:var(--font-mono)">v°</b> 表示不規則變化，展開詳解可看三態。<br><br>目前只標實詞，虛詞（冠詞、介系詞、連接詞、代名詞）改用游標提示。</div>`;

// ---- 窄螢幕的橫向圖例 ----
document.getElementById('legend-inline').innerHTML = `
  <div class="lrow"><b>成分</b>${CORE.map(r =>
    `<span><i style="background:var(--c-${r.toLowerCase()})"></i><em style="color:var(--c-${r.toLowerCase()})">${r}</em>${ROLE[r].zh}</span>`).join('')}
    <span><i style="background:repeating-linear-gradient(90deg,var(--c-mod) 0 3px,transparent 3px 6px)"></i>修飾語（方／地／時／頻）</span></div>
  <div class="lrow"><b>詞性</b>
    <span><em style="color:var(--pos-adj)">adj</em>形容詞</span>
    <span><em style="color:var(--pos-adv)">adv</em>副詞</span>
    <span style="color:var(--faint)"><em>n ／ v ／ aux</em>其餘實詞以灰色標示</span><span><em style="color:var(--c-v)">v°</em>不規則動詞</span>
    <span><em style="color:var(--pos-pron)">主／受／所有／所代</em>代名詞格位</span></div>`;

/** 找出這個字所屬子句的動詞資料（用來顯示三態） */
function verbInfoFor(sent, w){
  for (const cl of sent.clauses || []){
    const v = cl.verb;
    if (!v?.forms) continue;
    if (String(v.form || '').split(/\s+/).includes(w.text)) return v;
  }
  return null;
}

/** 把原句切成「純文字」與「成分」交錯的片段 — 原文完整保留，不增不減 */
function segments(sent){
  const cs = (sent.clauses || []).flatMap(cl =>
    (cl.constituents || []).filter(c => Number.isInteger(c.start)));
  cs.sort((a, b) => a.start - b.start || b.end - a.end);
  const segs = [];
  let pos = 0;
  for (const c of cs){
    if (c.start < pos) continue;
    if (c.start > pos) segs.push({ plain:true, from:pos, to:c.start });
    segs.push({ c, from:c.start, to:c.end });
    pos = c.end;
  }
  if (pos < sent.original.length) segs.push({ plain:true, from:pos, to:sent.original.length });
  return segs;
}

/** 渲染原句的 [from,to) 區間：落在區間內的單字包成詞性 span，其餘（空白、標點）原樣輸出 */
function renderRange(sent, from, to){
  const ws = (sent.words || []).filter(w => Number.isInteger(w.start) && w.start >= from && w.end <= to);
  let html = '', pos = from;
  for (const w of ws){
    if (w.start > pos) html += esc(sent.original.slice(pos, w.start));
    const vb = (w.pos === 'v' || w.pos === 'aux') ? verbInfoFor(sent, w) : null;
    const cs = w.pos === 'pron' ? (CASE[w.case] ? w.case : 'other') : '';
    html += `<span class="w" data-pos="${esc(w.pos)}" data-text="${esc(w.text)}"
      data-s="${w.start}" data-e="${w.end}"${cs ? ` data-case="${esc(cs)}"` : ''} tabindex="0"${
      CONTENT_POS.has(w.pos) ? '' : ' data-fn="1"'}${
      vb ? ` data-v3="${esc([vb.forms.base, vb.forms.past, vb.forms.pastParticiple].join(' · '))}"` : ''}${
      vb?.irregular ? ' data-irr="1"' : ''}
      ><i class="plbl">${esc(cs ? CASE[cs].short : w.pos)}</i>${esc(w.text)}</span>`;
    pos = w.end;
  }
  if (pos < to) html += esc(sent.original.slice(pos, to));
  return html;
}

function renderLine(sent){
  return segments(sent).map(s => {
    const inner = renderRange(sent, s.from, s.to);
    if (s.plain) return inner;
    const r = ROLE[s.c.role] || { code:'?', kind:'mod' };
    return `<span class="c ${r.kind}" data-role="${esc(s.c.role)}"><i class="lbl">${esc(r.code)}</i>${inner}</span>`;
  }).join('');
}

function wordOrderTable(wo){
  const keys = ['主','動','賓','方','地','時'];
  if (!wo || keys.every(k => !wo[k])) return '';
  return `<div><h4>主、動、賓、方、地、時</h4><div class="wo-scroll"><table class="wo"><tr>
    ${keys.map(k => `<th>${k}</th>`).join('')}</tr><tr>
    ${keys.map(k => wo[k] ? `<td>${esc(wo[k])}</td>` : `<td class="none">—</td>`).join('')}
  </tr></table></div></div>`;
}

function posList(sent){
  const ws = sent.words || [];
  if (!ws.length) return '';
  return `<div><h4>逐字詞性</h4><div class="poslist">${ws.map(w => {
    const c = w.pos === 'pron' && CASE[w.case] ? w.case : '';
    return `<span class="poschip" data-pos="${esc(w.pos)}"${c ? ` data-case="${esc(c)}"` : ''}>` +
      `<b>${esc(w.text)}</b><em>${esc(c ? CASE[c].zh : w.pos)}</em></span>`;
  }).join('')}</div></div>`;
}

/** 動詞三態表：句中出現的那一格會被標出來 */
function verbFormsTable(v){
  const f = v?.forms; if (!f) return '';
  const used = String(v.form || '').split(/\s+/);
  const cols = [['原形','base'],['過去式','past'],['過去分詞','pastParticiple'],['-ing','ing'],['三單','third']];
  return `<div class="v3${v.irregular ? ' irr' : ''}">
    <div class="v3-head">動詞三態${v.irregular
      ? '<span class="v3-tag">不規則變化，要背</span>'
      : '<span class="v3-tag reg">規則變化（＋ed）</span>'}</div>
    <div class="wo-scroll"><table class="wo v3-table"><tr>${
      cols.map(([zh]) => `<th>${zh}</th>`).join('')}</tr><tr>${
      cols.map(([, k]) => {
        const val = f[k] || '—';
        const hit = used.includes(val);
        return `<td class="${hit ? 'hit' : ''}">${esc(val)}</td>`;
      }).join('')}</tr></table></div></div>`;
}

function clauseDetail(cl){
  const t = cl.tense || {}, v = cl.verb || {};
  const ev = (t.evidence || []).map(e => `<b>${esc(e)}</b>`).join('');
  return `<div class="cl">
    <div class="cl-head"><span class="tag">${cl.role === 'main' ? '主句' : '從屬子句'}${
      cl.connector ? ` / ${esc(cl.connector)}` : ''}</span><b>${esc(cl.pattern?.name || '')}</b>
      <code style="font-family:var(--font-mono);font-size:.82rem;color:var(--accent)"> ${esc(cl.pattern?.label || '')}</code></div>
    <div class="kv">
      時態：<b>${esc(t.label || '')}</b> <code>${esc(t.formula || '')}</code>
      ${t.inScope === false ? ' <span style="color:var(--err)">· 超出國中必學 6 種</span>' : ''}<br>
      ${ev ? `判斷線索：<span class="ev">${ev}</span><br>` : ''}
      動詞：<b>${esc(v.form || '')}</b> ← 原形 ${esc(v.lemma || '')}
    </div>
    ${verbFormsTable(v)}</div>`;
}

function renderSentence(sent, showIdx){
  const main = (sent.clauses || []).find(c => c.role === 'main') || (sent.clauses || [])[0] || {};
  const aligned = (sent.clauses || []).every(c => c.alignment?.ok !== false) && sent.wordAlignment?.ok !== false;
  const notes = sent.notes || [];
  const errs = notes.filter(n => n.type === 'error');

  const ISSUE = {
    'not-english':  '不是英文',
    'fragment':     '不是完整句子',
    'unintelligible':'無法辨識',
  };
  const badges = [
    showIdx ? `<span class="badge idx">${(sent.index ?? 0) + 1}</span>` : '',
    sent.issue ? `<span class="badge warn">${esc(ISSUE[sent.issue] || sent.issue)}</span>` : '',
    main.pattern?.name ? `<span class="badge"><b>${esc(main.pattern.name)}</b><code>${esc(main.pattern.label || '')}</code></span>` : '',
    main.tense?.label ? `<span class="badge"><b>${esc(main.tense.label)}</b></span>` : '',
    errs.length ? `<span class="badge warn">${errs.length} 處文法問題</span>` : '',
    sent.inScope === false ? `<span class="badge warn">超出國中範圍</span>` : '',
  ].filter(Boolean).join('');

  const line = aligned
    ? `<p class="line">${renderLine(sent)}</p>`
    : `<p class="line">${esc(sent.original)}</p>
       <p class="fallback">座標對齊失敗，已降級為清單顯示，原句未受影響。<br>${
         (main.constituents || []).map(c => `${esc(c.text)} — ${esc((ROLE[c.role] || {}).zh || c.role)}`).join('／')}</p>`;

  const noteHtml = notes.length ? `<div><h4>提醒</h4><div class="notes">${notes.map(n => {
    const isErr = n.type === 'error';
    return `<div class="note ${isErr ? 'error' : 'tip'}">
      <span class="tag">${isErr ? `文法問題 · ${esc(n.errorCode || '')}` : '學習提示'}</span>
      ${esc(n.message)}
      ${isErr && n.correction ? `<span class="fix"><s>${esc(n.span || '')}</s><i>→</i><b>${esc(n.correction)}</b></span>` : ''}
    </div>`;
  }).join('')}</div></div>` : '';

  const sayable = (sent.original || '').trim();
  return `<article class="sent" data-sent="${esc(sayable)}">
    <div class="badges">${badges}${sayable
      ? `<button class="say" type="button" aria-label="朗讀這句" title="朗讀這句">
           <span class="ico" aria-hidden="true"></span><span class="txt">朗讀</span></button>` : ''}</div>
    <div class="body">
      ${line}
      <p class="zh">${esc(sent.translation || '')}</p>
      ${(sent.clauses || []).length || (sent.words || []).length || (sent.notes || []).length
        ? '<button class="more" aria-expanded="false">詳解 ＋</button>' : ''}
      <div class="detail" hidden>
        ${wordOrderTable(sent.wordOrder)}
        ${posList(sent)}
        ${(sent.clauses || []).length ? `<div><h4>子句拆解</h4>${sent.clauses.map(clauseDetail).join('')}</div>` : ''}
        ${noteHtml}
      </div>
    </div></article>`;
}

const out = document.getElementById('out');

/** 詞性標籤防重疊：短字（in / the）的標籤會互相黏住，偵測到就錯開到第二列 */
function layoutPosLabels(){
  for (const line of out.querySelectorAll('.line')){
    const labels = [...line.querySelectorAll('.plbl')];
    for (const l of labels) l.classList.remove('lower');
    line.classList.remove('has-lower');
    if (out.dataset.posMode === 'off' || out.dataset.mode === 'clean' || !labels.length) continue;

    let rowRight = [-Infinity, -Infinity], lastTop = null, anyLower = false;
    for (const l of labels){
      const r = l.getBoundingClientRect();
      if (!r.width) continue;                                    // 隱藏的虛詞標籤不參與排版
      if (lastTop === null || Math.abs(r.top - lastTop) > 6) rowRight = [-Infinity, -Infinity]; // 換行就重置
      lastTop = r.top;
      const row = r.left < rowRight[0] + 2 ? 1 : 0;
      if (row === 1){ l.classList.add('lower'); anyLower = true; }
      rowRight[row] = r.right;
    }
    if (anyLower) line.classList.add('has-lower');
  }
}

function showUsage(d){

  const secs = (d.ms / 1000).toFixed(1);
  const parts = [
    `<span class="u">句數 <b>${d.total}</b></span>`,
    `<span class="u">耗時 <b>${secs}s</b></span>`,
  ];
  if (d.analyzed){
    parts.push(`<span class="u">輸入 <b>${nf(u.inputTokens + u.cacheReadTokens)}</b> tokens</span>`);
    parts.push(`<span class="u">輸出 <b>${nf(u.outputTokens)}</b> tokens</span>`);
    parts.push(`<span class="u cost">參考費用 <b>${money(u.costUsd)}</b></span>`);
  }
  if (d.cached) parts.push(`<span class="u saved">快取命中 <b>${d.cached}</b> 句（未重新分析）</span>`);
  if (d.failed) parts.push(`<span class="u">失敗 <b>${d.failed}</b> 句</span>`);
  if (d.analyzed)
    parts.push(`<span class="note">參考費用是依 Claude API 牌價換算的估算值，用來掌握用量規模。` +
      `實際分析走本機 Claude 訂閱，不會另外向你收費，但會消耗訂閱額度 —— ` +
      `剩餘額度請在 Claude app → Settings → Usage 查看。</span>`);
  else if (d.cached)
    parts.push(`<span class="note">這段全部命中快取，沒有重新呼叫模型，不消耗任何額度。</span>`);
  usageBar.innerHTML = parts.join('');
  usageBar.hidden = false;
}

function placeholder(index, original, state){

async function analyzeLive(text){
  goBtn.disabled = true;
  Spk.stop();
  usageBar.hidden = true;
  out.innerHTML = '<p class="msg">斷句中…</p>';
  const t0 = Date.now();
  let total = 0, done = 0, gotDone = false;
  const slots = new Map();
  const settled = new Set();      // 已有結果（成功或失敗）的句子

  // 伺服器若中途消失，瀏覽器的 fetch 串流不一定會結束（實測砍掉後端後 read() 會一直懸著，
  // 且 AbortController 也打不斷已開始讀取的 body），所以讓每次讀取跟逾時賽跑。
  // 後端每 8 秒送一次心跳，30 秒收不到任何資料就代表後端真的不在了，
  // 不會誤殺還在分析的長句。
  const STALL_MS = 30_000;
  const ctrl = new AbortController();

  const paint = () => {
    out.innerHTML = [...slots.entries()].sort((a, b) => a[0] - b[0]).map(([, html]) => html).join('');
    if (out.dataset.mode === 'full') openAll(true);
    layoutPosLabels();
  };

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      signal: ctrl.signal,
      headers: { 'content-type': 'application/json', ...(TOKEN ? { 'x-auth-token': TOKEN } : {}) },
      body: JSON.stringify({ text }),
    });
    if (!res.ok){
      const e = await res.json().catch(() => ({}));
      out.innerHTML = `<p class="msg">${esc(
        e.error === 'too long' ? `文章太長了（${e.got} 字），目前上限 ${e.maxChars} 字。請分批貼上。` :
        e.error === 'empty' ? '請先輸入英文。' :
        res.status === 401 ? '存取權杖不正確或未提供。請用帶有 ?token=… 的網址開啟。' :
        '分析失敗：' + (e.error || res.status))}</p>`;
      return;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    const readOrStall = () => {
      let timer;
      return Promise.race([
        reader.read(),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('stalled')), STALL_MS); }),
      ]).finally(() => clearTimeout(timer));
    };
    for (;;){
      const { value, done: fin } = await readOrStall();
      if (fin) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const chunk of parts){
        const ev = /^event: (.+)$/m.exec(chunk)?.[1];
        const dataLine = /^data: (.+)$/m.exec(chunk)?.[1];
        if (!ev || !dataLine) continue;
        const d = JSON.parse(dataLine);

        if (ev === 'meta'){
          total = d.total;
          for (let i = 0; i < total; i++) slots.set(i, placeholder(i, '', '分析中'));
          paint();
          hintEl.textContent = d.truncated
            ? `這段文章超過 ${d.maxSentences} 句，只分析前 ${d.maxSentences} 句。`
            : `共 ${total} 句，分析中…`;
        } else if (ev === 'sentence'){
          slots.set(d.index, renderSentence(d.sentence, total > 1));
          settled.add(d.index);
          paint();
        } else if (ev === 'failed'){
          slots.set(d.index, `<article class="sent"><div class="badges">
            <span class="badge idx">${d.index + 1}</span><span class="badge warn">分析失敗</span></div>
            <div class="body"><p class="line">${esc(d.original)}</p>
            <p class="fallback">${esc(d.message)}</p></div></article>`);
          settled.add(d.index);
          paint();
        } else if (ev === 'halted'){
          const msg = d.kind === 'rate-limit'
            ? 'Claude 訂閱額度似乎已用盡，剩下的句子沒有送出。等額度重置後再試，已完成的句子仍會保留在快取。'
            : 'Claude 認證失效。請在終端機執行 claude 重新登入後再試。';
          usageBar.innerHTML = `<span class="u halt"><b>⚠</b> ${esc(msg)}</span>
            <span class="note">原始訊息：${esc(d.message)}</span>`;
          usageBar.hidden = false;
          markUnfinished(slots, settled, total, '沒有送出分析');
          paint();
        } else if (ev === 'progress'){
          done = d.done;
          hintEl.textContent = `分析中 ${done} / ${d.total} 句…`;
        } else if (ev === 'done'){
          gotDone = true;
          showUsage(d);
          hintEl.textContent = '可以再貼新的一段，或切到「練習」從這些句子出題。';
        }
      }
    }
    if (!gotDone && total && settled.size < total){
      markUnfinished(slots, settled, total, '分析被中斷');
      paint();
      showInterrupted(total - settled.size, text);
    }
  } catch (e){
    if (total && settled.size < total){
      markUnfinished(slots, settled, total, '分析中斷');
      paint();
      showInterrupted(total - settled.size, text);
    } else {
      out.innerHTML = `<p class="msg">連線失敗：${esc(e.message)}。` +
        `請確認後端有在執行（npm start）後再試一次。</p>`;
    }
  } finally {
    try { ctrl.abort(); } catch { /* 釋放連線，失敗無妨 */ }
    goBtn.disabled = false;
  }
}

/** 把還在轉圈的句子換成「未完成」狀態，不要讓它永遠轉下去 */
function markUnfinished(slots, settled, total, reason){
  for (let i = 0; i < total; i++){
    if (settled.has(i)) continue;
    slots.set(i, `<article class="sent"><div class="badges">
      <span class="badge idx">${i + 1}</span><span class="badge warn">${esc(reason)}</span></div>
      <div class="body"><p class="zh" style="border:0;padding:0;margin:0">
        這句還沒分析完。按下方的「重新分析」即可補上 —— 已完成的句子都在快取裡，不會重跑。
      </p></div></article>`);
  }
}

function showInterrupted(n, text){
  usageBar.innerHTML = `<span class="u halt"><b>⚠</b> 分析在完成前中斷，還有 ${n} 句沒有結果。</span>
    <span class="note">最常見的原因是後端重新啟動或停止。已完成的句子都存進快取了，
      按「重新分析」只會處理剩下那幾句。</span>
    <button class="retry" type="button">重新分析</button>`;
  usageBar.hidden = false;
  usageBar.querySelector('.retry')?.addEventListener('click', () => analyzeLive(text));
}

goBtn.addEventListener('click', () => {
  const text = inpEl.value.trim();
  if (!text) return;
  if (API){ analyzeLive(text); return; }
  // 展示模式：比對內建範例
  const norm = s => s.trim().replace(/\s+/g, ' ').toLowerCase();
  const hit = Object.keys(DATA).find(k => norm(DATA[k].input) === norm(text));
  if (hit) render(hit);
  else hintEl.textContent = API === false
    ? '展示模式只能顯示內建範例。要分析任意輸入，請在本機執行 npm start 後開啟 http://127.0.0.1:8787'
    : '正在確認後端連線，請稍候再按一次。';
});
inpEl.addEventListener('keydown', e => {

const tipEl = document.getElementById('tip');
function showTip(w){
  const c = w.closest('.c');
  const p = POS[w.dataset.pos] || { zh:w.dataset.pos, why:'' };
  const r = c ? ROLE[c.dataset.role] : null;
  const kase = w.dataset.case ? CASE[w.dataset.case] : null;
  tipEl.innerHTML = `<span class="t-word">${esc(w.dataset.text)}</span>

/** 把 display 裡要強調的部分包成 <mark> */
function qDisplay(q){
  const text = q.display ?? q.sentence ?? '';
  if (q.highlight && Number.isInteger(q.highlight.start)){
    const { start, end } = q.highlight;
    return esc(text.slice(0, start)) + '<mark>' + esc(text.slice(start, end)) + '</mark>' + esc(text.slice(end));
  }
  if (q.highlightText && text.includes(q.highlightText)){
    const i = text.indexOf(q.highlightText);
    return esc(text.slice(0, i)) + '<mark>' + esc(q.highlightText) + '</mark>'
      + esc(text.slice(i + q.highlightText.length));
  }
  return esc(text);
}

function renderQuestion(q, n){
  const typeLabel = Object.fromEntries(QTYPES)[q.type] || q.type;
  const body = q.inputMode === 'choice'
    ? `<div class="q-opts">${q.choices.map((c, i) => `
        <label class="q-opt"><input type="radio" name="${q.id}" value="${esc(c.value)}"> ${esc(c.label)}</label>`).join('')}</div>`
    : `<div class="q-blanks">${Array.from({ length: q.blanks || 1 }, (_, i) =>
        `<input type="text" data-q="${q.id}" data-i="${i}" autocomplete="off" spellcheck="false"
           placeholder="${q.blanks > 1 ? `第 ${i + 1} 格` : '填入答案'}">`).join('')}</div>`;

  return `<article class="q" id="card-${q.id}">
    <div class="q-head"><span class="q-no">${n}</span><span class="q-type">${esc(typeLabel)}</span>
      <span class="q-prompt">${esc(q.prompt)}</span></div>
    <div class="q-sent">${qDisplay(q)}</div>
    ${q.hint ? `<div class="q-hint">（${esc(q.hint)}）</div>` : ''}
    ${q.type === 'error-fix' ? '<div class="hint">只要填改正後的那一小段就好，例如 tastes good</div>' : ''}
    ${body}
  </article>`;
}

async function startQuiz(){
  quizSummary.hidden = true; quizActions.hidden = true; quizAgain.hidden = true;
  quizSubmit.disabled = false;
  quizOut.innerHTML = '<p class="msg">出題中…</p>';
  try {
    const res = await fetch('/api/exercises', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...(TOKEN ? { 'x-auth-token': TOKEN } : {}) },
      body: JSON.stringify({ count: Number(document.getElementById('qcount').value),
        types: selectedTypes(), userToken: USER }),
    });
    const d = await res.json();
    if (!res.ok){
      quizOut.innerHTML = `<p class="msg">${esc(d.message || d.error || '出題失敗')}</p>`;
      return;
    }
    if (!d.questions.length){
      quizOut.innerHTML = '<p class="msg">目前的句子出不了這些題型。先到「分析」多貼幾句，或改選其他題型。</p>';
      return;
    }
    currentQuiz = d;
    quizOut.innerHTML = d.questions.map((q, i) => renderQuestion(q, i + 1)).join('');
    hardenAnswers(quizOut);
    quizHint.textContent = `共 ${d.questions.length} 題，題庫 ${d.pool} 句。`;
    quizActions.hidden = false;
  } catch (e){
    quizOut.innerHTML = `<p class="msg">連線失敗：${esc(e.message)}</p>`;
  }
}

async function submitQuiz(){
  if (!currentQuiz) return;
  quizSubmit.disabled = true;
  const answers = {};
  for (const q of currentQuiz.questions){
    answers[q.id] = q.inputMode === 'choice'
      ? [quizOut.querySelector(`input[name="${q.id}"]:checked`)?.value ?? '']
      : [...quizOut.querySelectorAll(`input[data-q="${q.id}"]`)].map(el => el.value);
  }
  try {
    const res = await fetch('/api/attempts', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...(TOKEN ? { 'x-auth-token': TOKEN } : {}) },
      body: JSON.stringify({ quizId: currentQuiz.quizId, userToken: USER, answers }),
    });
    const d = await res.json();
    if (!res.ok){
      quizOut.insertAdjacentHTML('afterbegin', `<p class="msg">${esc(d.message || d.error)}</p>`);
      quizSubmit.disabled = false;
      return;
    }

    const byId = new Map(currentQuiz.questions.map(q => [q.id, q]));
    const wrongTypes = {};
    for (const r of d.results){
      const card = document.getElementById(`card-${r.id}`);
      if (!card) continue;
      card.classList.add('graded', r.correct ? 'ok' : 'ng');
      for (const el of card.querySelectorAll('input')) el.disabled = true;
      if (!r.correct){
        const t = byId.get(r.id)?.type;
        wrongTypes[t] = (wrongTypes[t] || 0) + 1;
      }
      card.insertAdjacentHTML('beforeend', `<div class="q-result">
        <span class="q-verdict">${r.correct ? '✓ 答對了' : '✗ 答錯了'}</span>${
        r.correct ? '' : `正解：<span class="q-ans">${esc(r.expected.join('　'))}</span>\n`}${esc(r.explain)}</div>`);
    }

    const pct = Math.round(d.correct / d.total * 100);
    const labels = Object.fromEntries(QTYPES);
    quizSummary.innerHTML = `<div class="sum-score"><b>${d.correct}</b> / ${d.total} 答對（${pct}%）</div>` +
      (Object.keys(wrongTypes).length
        ? `<div class="sum-break">需要加強：${Object.entries(wrongTypes)
            .map(([t, n]) => `${labels[t] || t} 錯 ${n} 題`).join('、')}</div>`
        : `<div class="sum-break">全對。換一份再練，或到「分析」貼新文章擴充題庫。</div>`)
      + `<div class="sum-break">作答已記錄，可到「弱點」看各句型與時態的正確率。</div>`;
    quizSummary.hidden = false;
    quizSummary.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    quizAgain.hidden = false;
  } catch (e){
    quizSubmit.disabled = false;
    quizOut.insertAdjacentHTML('afterbegin', `<p class="msg">交卷失敗：${esc(e.message)}</p>`);
  }
}

const spkCtl = document.getElementById('spkCtl');

function clearSaying(){
  for (const el of out.querySelectorAll('.w.saying')) el.classList.remove('saying');
  for (const el of out.querySelectorAll('.sent.saying')) el.classList.remove('saying');
  for (const b of out.querySelectorAll('.say[aria-pressed="true"]')){

  }
  sayingCard = null;

/** 唸到哪個字就標哪個字：用字元區間和單字 span 的座標取交集 */
function markWord(card, start, end){
  for (const el of card.querySelectorAll('.w.saying')) el.classList.remove('saying');
  if (!(end > start)) return;
  for (const el of card.querySelectorAll('.w[data-s]')){
    const s = Number(el.dataset.s), e = Number(el.dataset.e);
    if (s < end && e > start) el.classList.add('saying');
  }
}

function toggleSay(card){
  const btn = card.querySelector('.say');
  const text = card.dataset.sent || '';
  if (sayingCard === card){ Spk.stop(); return; }   // 再點一次＝停止
  clearSaying();
  if (!text) return;

  sayingCard = card;
  card.classList.add('saying');
  btn.setAttribute('aria-pressed', 'true');
  btn.querySelector('.txt').textContent = '停止';

  Spk.speak(text, {
    onWord: ({ start, end }) => { if (sayingCard === card) markWord(card, start, end); },
    onEnd: () => clearSaying(),
    onError: (err) => {
      clearSaying();
      btn.title = `朗讀失敗：${err.message}`;
    },
  });
}

/* ---- 作答欄位強化 ----
 * 網頁「無法」關閉作業系統的輸入法本身（注音／拼音的選字視窗一定會跳出來），
 * 能做的是讓它打出來的字進不了欄位，效果上等同禁用：
 *   1. 關掉瀏覽器自己的自動完成、拼字檢查、自動修正、自動大寫
 *   2. 欄位名稱隨機，瀏覽器記不住上次打過什麼
 *   3. 擋掉貼上與拖放
 *   4. 偵測到輸入法組字就提示，組完把非英文字元濾掉
 */
const ANSWER_ALLOWED = /[^A-Za-z0-9 '’\-.,?!]/g;

function hardenAnswerInput(inp){
  if (inp.dataset.hardened) return;
  inp.dataset.hardened = '1';
  inp.setAttribute('autocomplete', 'off');
  inp.setAttribute('autocorrect', 'off');
  inp.setAttribute('autocapitalize', 'off');
  inp.setAttribute('spellcheck', 'false');
  inp.setAttribute('inputmode', 'text');
  inp.setAttribute('name', 'a' + Math.random().toString(36).slice(2, 8));

  let note = null, timer = null;
  const warn = (msg) => {
    if (!note){
      note = document.createElement('div');
      note.className = 'ime-warn';
      inp.parentElement?.appendChild(note);
    }
    note.textContent = msg;
    note.dataset.show = '1';
    clearTimeout(timer);
    timer = setTimeout(() => { if (note) note.dataset.show = '0'; }, 2600);
  };

  const strip = () => {
    // 全形英數先轉半形再過濾 —— 輸入法停在全形時打 free 不該整個消失
    const half = inp.value.replace(/[\uFF01-\uFF5E]/g,
      c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
    const clean = half.replace(ANSWER_ALLOWED, '');
    if (clean !== inp.value){
      const atEnd = inp.selectionStart === inp.value.length;
      inp.value = clean;
      if (atEnd) inp.setSelectionRange(clean.length, clean.length);
      warn('作答請切換成英文輸入法，這一格只收英文。');
    }
  };

  // 組字過程中不能動 value，否則輸入法會錯亂；等組完再濾
  let composing = false;
  inp.addEventListener('compositionstart', () => {
    composing = true;
    warn('偵測到中文輸入法，請切換成英文再作答。');
  });
  inp.addEventListener('compositionend', () => { composing = false; strip(); });
  inp.addEventListener('input', () => { if (!composing) strip(); });

  inp.addEventListener('paste', e => { e.preventDefault(); warn('作答時不能貼上，請自己拼出來。'); });
  inp.addEventListener('drop',  e => { e.preventDefault(); warn('作答時不能拖放文字。'); });
}

/** 把一個容器裡所有作答欄位都強化 */
function hardenAnswers(root){
  for (const inp of root.querySelectorAll('.q-blanks input')) hardenAnswerInput(inp);
}

    el('wsList').innerHTML = recent.map(chip).join('')
      + (restOpen ? rest.map(chip).join('') : '')
      + (rest.length ? `<button class="linky" id="wsMore" style="margin-left:4px">${
          restOpen ? '收起舊字表' : `更多 ${rest.length} 份`}</button>` : '')
      + `<button class="linky danger" id="wsDel" style="margin-left:10px">刪除目前字表</button>`;
    if (!wsCurrent || !d.sets.some(x => x.id === wsCurrent)) await selectSet(d.sets[0].id);
  } catch (e){
    el('wsList').innerHTML = `<span class="hint">載入失敗：${esc(e.message)}</span>`;
  }
}

async function selectSet(id){
  wsCurrent = id;
  for (const b of el('wsList').querySelectorAll('.wchip'))
    b.setAttribute('aria-pressed', String(Number(b.dataset.id) === id));
  const d = await fetch(`/api/wordset?id=${id}&user=${encodeURIComponent(USER)}`).then(r => r.json());
  wsWordsCache = d.words || [];
  const st = d.stats || { words:0, attempts:0, correct:0, mastered:0, weak:0 };
  const pct = st.attempts ? Math.round(st.correct / st.attempts * 100) : 0;
  el('wsStats').innerHTML =
    `<div class="ucard"><h4>單字</h4><div class="big">${st.words}</div>
       <div class="sub">共 ${wsWordsCache.reduce((a,w)=>a+(w.senses?.length||0),0)} 個意思</div></div>`
  + `<div class="ucard"><h4>已背熟</h4><div class="big">${st.mastered}</div>
       <div class="sub">連續答對 3 次以上<br>之後會隔比較久才再考</div></div>`
  + `<div class="ucard"><h4>待加強</h4><div class="big">${st.weak}</div>
       <div class="sub">最近答錯過<br>下次出題會優先挑</div></div>`
  + `<div class="ucard"><h4>正確率</h4><div class="big">${st.attempts ? pct + '%' : '—'}</div>
       <div class="sub">${st.correct} / ${st.attempts} 題</div></div>`;
  el('wsPanel').hidden = false;
  el('wsSummary').hidden = true;
  el('wsActions').hidden = true;
  el('wsOut').innerHTML = '';
  renderWordList();
}

/** 小朗讀鈕。沒有語音能力時不產生，避免出現按了沒反應的按鈕 */
function sayBtn(text, label){
  if (!Spk.available()) return '';
  return `<button class="sayx" type="button" data-say="${esc(text)}"
    aria-label="${esc(label)}" title="${esc(label)}"><span class="ico"></span></button>`;
}

function renderWordList(){
  el('wsWords').innerHTML = `<div class="wlist">${wsWordsCache.map(w => {
    const tag = w.total === 0 ? '<span class="box-tag">還沒考過</span>'
      : w.box >= 3 ? `<span class="box-tag good">已背熟 ${w.correct}/${w.total}</span>`
      : `<span class="box-tag hot">再加強 ${w.correct}/${w.total}</span>`;
    return `<div class="wcard"><div class="top">
      <span class="term">${esc(w.term)}</span>
      ${w.syllables ? `<span class="syl">${esc(w.syllables)}</span>` : ''}
      ${sayBtn(w.term, '唸這個單字')}${tag}</div>
      ${(w.senses||[]).map(sn => `<div class="wsense"><b>${esc(sn.pos)}</b>${esc(sn.zh)}
        ${sn.example ? `<span class="ex">${esc(sn.example)}${sayBtn(sn.example, '朗讀例句')}</span>` : ''}
        ${sn.exampleZh ? `<span class="exz">${esc(sn.exampleZh)}</span>` : ''}</div>`).join('')}
      ${w.spellTip ? `<div class="wtip">拼字：${esc(w.spellTip)}</div>` : ''}
      ${(w.confusable||[]).length ? `<div class="wextra">易混淆：${w.confusable.map(c=>`${esc(c.word)}（${esc(c.zh)}）`).join('、')}</div>` : ''}
      ${(w.family||[]).length ? `<div class="wextra">衍生字：${w.family.map(c=>`${esc(c.word)}（${esc(c.zh)}）`).join('、')}</div>` : ''}
      </div>`;
  }).join('')}</div>`;
}

function renderWordQ(q, n){
  const body = q.inputMode === 'choice'
    ? `<div class="q-opts">${q.choices.map(c =>
        `<label class="q-opt"><input type="radio" name="${q.id}" value="${esc(c.value)}"> ${esc(c.label)}</label>`).join('')}</div>`
    : `<div class="q-blanks"><input type="text" data-q="${q.id}" autocomplete="off"
         spellcheck="false" autocapitalize="off" placeholder="填入答案"></div>`;
  const head = q.mode === 'listen'
    ? `<button class="q-speak" type="button" data-say="${esc(q.speak)}"><span class="ico"></span>播放</button>`
    : q.mode === 'zh2en' ? `<div class="q-zh">${esc(q.question)}</div>`
    : q.question ? `<div class="q-sent">${esc(q.question)}</div>` : '';
  return `<article class="q" id="wq-${q.id}">
    <div class="q-head"><span class="q-no">${n}</span>
      <span class="q-type">${esc(WMODE_NAME[q.mode])}</span>
      <span class="q-prompt">${esc(q.prompt)}</span></div>
    ${head}
    ${q.hint ? `<div class="q-hint">${esc(q.hint)}</div>` : ''}
    ${body}</article>`;
}

async function startWordQuiz(){
  el('wsSummary').hidden = true; el('wsActions').hidden = true;
  el('wsAgain').hidden = true; el('wsSubmit').disabled = false;
  el('wsWords').hidden = true; el('wsToggleList').textContent = '看單字清單';
  el('wsOut').innerHTML = '<p class="msg">出題中…</p>';
  try {
    const d = await fetch('/api/wordquiz', {
      method:'POST', headers:{ 'content-type':'application/json', ...(TOKEN?{'x-auth-token':TOKEN}:{}) },
      body: JSON.stringify({ setId: wsCurrent, userToken: USER,
        count: Number(el('wsCount').value), modes: wsModesSel() }),
    }).then(r => r.json());
    if (d.error){ el('wsOut').innerHTML = `<p class="msg">${esc(d.message || d.error)}</p>`; return; }
    wsQuiz = d;
    el('wsOut').innerHTML = d.questions.map((q,i) => renderWordQ(q, i+1)).join('');
    hardenAnswers(el('wsOut'));
    el('wsActions').hidden = false;
    // 只有第一題本身是聽考才自動唸。先前用 querySelector('.q-speak') 會抓到
    // 整份測驗裡任何一題的聽考鈕，等於提前唸出後面題目的答案。
    const firstQ = d.questions[0];
    if (firstQ?.mode === 'listen')
      el('wsOut').querySelector(`#wq-${firstQ.id} .q-speak`)?.click();
  } catch (e){ el('wsOut').innerHTML = `<p class="msg">出題失敗：${esc(e.message)}</p>`; }
}

// 單字分頁裡所有 data-say 的按鈕統一處理（單字、例句、聽考的播放鈕）
el('view-words').addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (!b) return;
  if (b.classList.contains('on')){ Spk.stop(); return; }   // 再按一次停止
  for (const x of document.querySelectorAll('[data-say].on')) x.classList.remove('on');
  b.classList.add('on');
  Spk.speak(b.dataset.say, { onEnd: () => b.classList.remove('on') });
});

async function submitWordQuiz(){
  if (!wsQuiz) return;
  el('wsSubmit').disabled = true;
  const answers = {};
  for (const q of wsQuiz.questions)
    answers[q.id] = q.inputMode === 'choice'
      ? [el('wsOut').querySelector(`input[name="${q.id}"]:checked`)?.value ?? '']
      : [el('wsOut').querySelector(`input[data-q="${q.id}"]`)?.value ?? ''];
  try {
    const d = await fetch('/api/wordattempts', {
      method:'POST', headers:{ 'content-type':'application/json', ...(TOKEN?{'x-auth-token':TOKEN}:{}) },
      body: JSON.stringify({ quizId: wsQuiz.quizId, userToken: USER, answers }),
    }).then(r => r.json());
    if (d.error){ el('wsSubmit').disabled = false;
      el('wsOut').insertAdjacentHTML('afterbegin', `<p class="msg">${esc(d.message||d.error)}</p>`); return; }

    const wrong = [];
    for (const r of d.results){
      const card = document.getElementById(`wq-${r.id}`);
      if (!card) continue;
      card.classList.add('graded', r.correct ? 'ok' : 'ng');
      for (const i of card.querySelectorAll('input')) i.disabled = true;
      if (!r.correct) wrong.push(r.term);
      card.insertAdjacentHTML('beforeend', `<div class="q-result">
        <span class="q-verdict">${r.correct ? '✓ 答對了' : '✗ 答錯了'}</span>${
        r.correct ? '' : `正解：<span class="q-ans">${esc(r.expected.join('　'))}</span>\n`}${esc(r.explain)}</div>`);
    }
    const pct = Math.round(d.correct / d.total * 100);
    el('wsSummary').innerHTML = `<div class="sum-score"><b>${d.correct}</b> / ${d.total} 答對（${pct}%）</div>`
      + (wrong.length ? `<div class="sum-break">答錯的字：${esc([...new Set(wrong)].join('、'))}
          —— 這些會馬上回到待加強，下一輪優先出現。</div>`
        : `<div class="sum-break">全對。這些字會隔比較久才再考，先去練別的。</div>`);
    el('wsSummary').hidden = false;
    el('wsSummary').scrollIntoView({ behavior:'smooth', block:'nearest' });
    el('wsAgain').hidden = false;
    await selectSetStatsOnly();
  } catch (e){
    el('wsSubmit').disabled = false;
    el('wsOut').insertAdjacentHTML('afterbegin', `<p class="msg">交卷失敗：${esc(e.message)}</p>`);
  }
}

/** 交卷後只更新統計與清單，不動測驗結果 */
async function selectSetStatsOnly(){
  const d = await fetch(`/api/wordset?id=${wsCurrent}&user=${encodeURIComponent(USER)}`).then(r => r.json());
  wsWordsCache = d.words || [];
  const st = d.stats;
  const pct = st.attempts ? Math.round(st.correct / st.attempts * 100) : 0;
  const cards = el('wsStats').querySelectorAll('.ucard .big');
  if (cards[1]) cards[1].textContent = st.mastered;
  if (cards[2]) cards[2].textContent = st.weak;
  if (cards[3]) cards[3].textContent = st.attempts ? pct + '%' : '—';
  const sub = el('wsStats').querySelectorAll('.ucard .sub');
  if (sub[3]) sub[3].textContent = `${st.correct} / ${st.attempts} 題`;
  renderWordList();
}

el('wsList').addEventListener('click', async e => {
  const b = e.target.closest('.wchip');
  if (b) return selectSet(Number(b.dataset.id));
  if (e.target.id === 'wsMore'){
    el('wsList').dataset.expanded = el('wsList').dataset.expanded === '1' ? '0' : '1';
    return loadWordsets();
  }
  const del = e.target.closest('#wsDel');
  if (del && wsCurrent){
    // 刪除會連同該字表的所有練習進度一起消失，所以要按兩次
    if (del.dataset.armed !== '1'){
      const name = document.querySelector(`.wchip[data-id="${wsCurrent}"]`)?.firstChild?.textContent?.trim() ?? '';
      del.dataset.armed = '1';
      del.textContent = `再按一次刪除「${name}」`;
      clearTimeout(del._t);
      del._t = setTimeout(() => { del.dataset.armed = '0'; del.textContent = '刪除目前字表'; }, 4000);
      return;
    }
    clearTimeout(del._t);
    await fetch(`/api/wordsets?id=${wsCurrent}`, { method:'DELETE',
      headers: TOKEN ? { 'x-auth-token': TOKEN } : {} });
    wsCurrent = null; await loadWordsets();
  }
});
el('wsToggleList').addEventListener('click', () => {
  const w = el('wsWords'); w.hidden = !w.hidden;

el('wsStart').addEventListener('click', startWordQuiz);

// ===== 弱點 =====
const PATTERN_NAMES = { 1:'句型一', 2:'句型二', 3:'句型三', 4:'句型四', 5:'句型五' };
const PATTERN_FORM  = { 1:'S+V', 2:'S+V+C', 3:'S+V+O', 4:'S+V+IO+DO', 5:'S+V+O+C' };
// 國中必學 6 種時態，照講義順序
const CORE_TENSES = [
  ['present-simple','現在簡單式'], ['present-progressive','現在進行式'],
  ['past-simple','過去簡單式'],    ['past-progressive','過去進行式'],
  ['future-simple','未來式'],      ['present-perfect','現在完成式'],
];
// 超出國中範圍但可能被作答到的時態
const EXTRA_TENSES = {
  'present-perfect-progressive':'現在完成進行式', 'past-perfect':'過去完成式',
  'past-perfect-progressive':'過去完成進行式', 'future-progressive':'未來進行式',
  'future-perfect':'未來完成式', 'future-perfect-progressive':'未來完成進行式',
  'past-future-simple':'過去未來式', 'past-future-progressive':'過去未來進行式',
  'past-future-perfect':'過去未來完成式', 'past-future-perfect-progressive':'過去未來完成進行式',
};
const QTYPE_NAMES = { 'pattern':'句型判斷', 'tense':'時態填空', 'pos':'詞性判斷',
  'verb-forms':'動詞三態', 'error-fix':'改錯',
  'pronoun-case':'代名詞格位', 'pronoun-fill':'代名詞填空' };
const MIN_N = 2;   // 少於這個作答數就標為資料不足，不下判斷

/** 一列：名稱、長條、百分比、分數、狀態標籤。數字與標籤都在，不靠顏色辨識 */
function wkRow(name, sub, correct, total){
  if (!total) return `<div class="wk-row none">
    <div class="name">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
    <div class="wk-track"><div class="wk-fill" style="width:0"></div></div>
    <div class="wk-val"><b>—</b><span class="frac">未作答</span><span class="tag">無資料</span></div></div>`;
  const pct = Math.round(correct / total * 100);
  const thin = total < MIN_N;
  const cls = thin ? 'none' : pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad';
  const tag = thin ? '資料不足' : pct >= 80 ? '熟練' : pct >= 50 ? '待加強' : '最弱';
  return `<div class="wk-row ${cls}">
    <div class="name">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
    <div class="wk-track"><div class="wk-fill" style="width:${pct}%"></div></div>
    <div class="wk-val"><b>${pct}%</b><span class="frac">${correct}/${total}</span>
      <span class="tag">${tag}</span></div></div>`;
}

function wkSection(title, cap, rows){
  return `<div class="wk-sec"><h4>${esc(title)}</h4><p class="cap">${esc(cap)}</p>
    <div class="wk-rows">${rows}</div></div>`;
}

async function loadWeakness(){
  const head = document.getElementById('weakHead');
  const charts = document.getElementById('weakCharts');
  charts.innerHTML = '<p class="msg">載入中…</p>';
  try {
    const w = await fetch(`/api/weakness?user=${encodeURIComponent(USER)}`).then(r => r.json());
    const o = w.overall || { total: 0, correct: 0 };
    if (!o.total){
      head.innerHTML = '';
      charts.innerHTML = `<div class="wk-empty">還沒有作答紀錄。<br>
        先到「練習」做一份，這裡就會依句型、時態、詞性、題型統計你的正確率，
        並在之後出題時優先挑你最弱的部分。</div>`;
      return;
    }

    const pct = Math.round(o.correct / o.total * 100);
    head.innerHTML = `<div class="wk-hero">
      <div><div class="n">${pct}%</div><div class="lbl">整體正確率<br>${o.correct} / ${o.total} 題</div></div>
      <div class="sep"></div>
      <div><div class="lbl" style="margin:0">出題時會依這些數字加權，<br>
        最弱的維度出現機率最高（全錯約 2.5 倍、全對約 0.25 倍）。</div></div>
      <button class="primary cta" id="weakPractice">針對弱點練習</button></div>`;

    const byP = new Map((w.byPattern || []).map(r => [r.pattern_id, r]));
    const patternRows = [1,2,3,4,5].map(id => {
      const r = byP.get(id);
      return wkRow(PATTERN_NAMES[id], PATTERN_FORM[id], r?.correct ?? 0, r?.total ?? 0);
    }).join('');

    const byT = new Map((w.byTense || []).map(r => [`${r.tense_time}-${r.tense_aspect}`, r]));
    const tenseRows = CORE_TENSES.map(([k, zh]) => {
      const r = byT.get(k);
      return wkRow(zh, '', r?.correct ?? 0, r?.total ?? 0);
    }).join('');
    const extraTense = (w.byTense || []).filter(r =>
      !CORE_TENSES.some(([k]) => k === `${r.tense_time}-${r.tense_aspect}`));
    const extraRows = extraTense.map(r => {
      const k = `${r.tense_time}-${r.tense_aspect}`;
      return wkRow(EXTRA_TENSES[k] || k, '超出範圍', r.correct, r.total);
    }).join('');

    const posRows = (w.byPos || []).sort((a, b) => a.correct / a.total - b.correct / b.total)
      .map(r => wkRow(POS[r.pos]?.zh || r.pos, r.pos, r.correct, r.total)).join('');

    const CASE_ORDER = [['subject','主格'],['object','受格'],['possessive','所有格'],
      ['possessive-pron','所有格代名詞'],['reflexive','反身代名詞']];
    const byC = new Map((w.byCase || []).map(r => [r.pron_case, r]));
    const caseRows = (w.byCase || []).length
      ? CASE_ORDER.map(([k, zh]) => { const r = byC.get(k);
          return wkRow(zh, '', r?.correct ?? 0, r?.total ?? 0); }).join('')
      : '';

    const typeRows = (w.byType || []).sort((a, b) => a.correct / a.total - b.correct / b.total)
      .map(r => wkRow(QTYPE_NAMES[r.qtype] || r.qtype, '', r.correct, r.total)).join('');

    charts.innerHTML =
      wkSection('五大句型', '五種都列出來，沒作答過的標為無資料。', patternRows) +
      wkSection('時態', '國中必學的 6 種固定列出；超出範圍的作答另外列在下方。',
        tenseRows + extraRows) +
      (caseRows ? wkSection('代名詞格位', '五種格位固定列出，沒作答過的標為無資料。', caseRows) : '') +
      (posRows ? wkSection('詞性', '依正確率由低到高排序。', posRows) : '') +
      (typeRows ? wkSection('題型', '哪一種題目最常答錯。', typeRows) : '');

    document.getElementById('weakPractice')?.addEventListener('click', () => {
      document.querySelector('.tabs button[data-view="practice"]').click();
      startQuiz();
    });
  } catch (e){
    charts.innerHTML = `<p class="msg">載入失敗：${esc(e.message)}</p>`;
  }
}

  });
}
